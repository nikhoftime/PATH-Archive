<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PATH Singapore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the room fills the whole screen (cover); where the screen is a different shape, drag/scroll to look around. Hotspots are % of the image; dark card on click, bottom sheet on phones */
:root {
  --ground: #121214;
  --card: #1e1f22;
  --ink: #f2f0ec;
  --ink-dim: #a9a7a2;
  --ink-faint: #6e6c68;
  --signal: #ff4a2e;
  --signal-soft: rgba(255, 74, 46, 0.35);
  --paper: #26272b;
  --line: rgba(242,240,236,.7);
  --scrim: rgba(10, 10, 12, 0.62);
  --font-sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink);
  font-family: var(--font-sans); overflow: hidden;
}
/* desktop / tablet: the room always fills the window. Any small crop is taken mostly from the
   left (window and plant) and the top (wall), so the logos, book and devices stay in view. */
.stage { position: fixed; inset: 0; overflow: hidden; }
.scene {
  --W: calc(1.05 * max(100vw, calc(100vh * 3344 / 1882)));
  --H: calc(1.05 * max(100vh, calc(100vw * 1882 / 3344)));
  position: absolute; width: var(--W); height: var(--H);
  left: calc((100vw - var(--W)) * .5); top: calc((100vh - var(--H)) * .9);
}
.scene > img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; pointer-events: none; }
/* tall screens (phones held upright, portrait tablets): a separate portrait render of the room
   (scene-portrait.jpg, 2048x3072) fills the screen. Hotspots move to their portrait positions in JS. */
@media (max-aspect-ratio: 3/4) {
  .stage { position: fixed; inset: 0; overflow: hidden; background: #2a2018; }
  .scene { --vh: 100vh; --W: max(100vw, calc(var(--vh) * 940 / 1672)); --H: max(var(--vh), calc(100vw * 1672 / 940));
    width: var(--W); height: var(--H); left: calc((100vw - var(--W)) / 2); top: calc((var(--vh) - var(--H)) / 2); }
  @supports (height: 100dvh) { .scene { --vh: 100dvh; } }
  /* cameras are small on a phone, so they travel further to read as floating */
}
@keyframes hoverLp { 0%,100% { transform: translate(0,2px) rotate(2deg); } 50% { transform: translate(2px,-16px) rotate(-6deg); } }
@keyframes hoverRp { 0%,100% { transform: translate(0,2px) rotate(-2deg); } 50% { transform: translate(-2px,-15px) rotate(5deg); } }
.stage.dragging .hot { pointer-events: none; }

/* chrome */
.brand {
  position: fixed; z-index: 5;
  top: calc(16px + env(safe-area-inset-top,0px)); left: max(16px, env(safe-area-inset-left,0px));
  color: var(--ink); text-shadow: 0 1px 8px rgba(0,0,0,.5);
  display: grid; gap: 6px; justify-items: start;
  padding: 10px 14px; border-radius: 14px;
  background: rgba(18,18,20,.42); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.12);
}
.brand .lockup { display: flex; align-items: center; gap: 10px; }
.brand .lockup img { height: 20px; width: auto; display: block; filter: drop-shadow(0 1px 6px rgba(0,0,0,.4)); }
.brand .lockup span {
  font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--ink); padding-left: 10px; border-left: 1px solid rgba(255,255,255,.3); line-height: 16px;
}
.brand small { font-size: 12px; color: rgba(242,240,236,.82); letter-spacing: .01em; }
.brand small.brand__world { margin-top: -2px; color: rgba(242,240,236,.6); font-style: italic; }
@media (max-width: 640px) {
  .brand { padding: 8px 11px; gap: 4px; border-radius: 12px; top: calc(12px + env(safe-area-inset-top,0px)); left: max(12px, env(safe-area-inset-left,0px)); }
  .brand .lockup { gap: 8px; } .brand .lockup img { height: 15px; }
  .brand .lockup span { font-size: 10px; padding-left: 8px; line-height: 13px; }
  .brand small { font-size: 10.5px; }
  .help { width: 38px; height: 38px; top: calc(12px + env(safe-area-inset-top,0px)); right: max(12px, env(safe-area-inset-right,0px)); }
}
.help {
  position: fixed; z-index: 5;
  top: calc(14px + env(safe-area-inset-top,0px)); right: max(16px, env(safe-area-inset-right,0px));
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.25); background: rgba(18,18,20,.55);
  color: var(--ink); font: 500 16px var(--font-sans); cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.help[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.hint {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom,0px));
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink); background: rgba(18,18,20,.6); backdrop-filter: blur(6px);
  padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  transition: opacity .4s; display: flex; align-items: center; gap: 8px; pointer-events: none;
}
.hint .pan { display: none; }
.can-pan .hint .pan { display: inline; }
.hint .touch { display: none; }
@media (pointer: coarse) { .hint .touch { display: inline; } .hint .mouse { display: none; } }
.hint.gone { opacity: 0; pointer-events: none; }

/* hotspots */
.hot {
  position: absolute; border: 0; padding: 0; margin: 0;
  background: transparent; cursor: pointer; outline: none;
  pointer-events: none;            /* the traced outline below is the hit area */
}
.hot .badge { pointer-events: auto; cursor: pointer; }
/* traced outlines of each object */
.outlines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; z-index: 1; }
.outlines path {
  fill: rgba(255,255,255,0); stroke: rgba(255,255,255,0); stroke-width: 1.5px; vector-effect: non-scaling-stroke;
  stroke-linejoin: round; cursor: pointer; pointer-events: all; rx: 0;
  transition: fill .25s, stroke .25s, filter .25s;
}
.outlines path.on, .show-all .outlines path {
  fill: rgba(253,110,61,.08); stroke: #fd6e3d; stroke-width: 2px;
  filter: drop-shadow(0 0 8px rgba(253,110,61,.6));
}
.outlines path.focus { stroke: #fff; stroke-width: 2px; }
.hot { z-index: 2; }
.hot .badge {
  position: absolute; top: -13px; right: -13px;
  width: 27px; height: 27px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(253, 110, 61, 0.82); color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(8px) saturate(140%); -webkit-backdrop-filter: blur(8px) saturate(140%);
  box-shadow: 0 0 0 3px rgba(253,110,61,.18), 0 0 14px rgba(253,110,61,.45), 0 2px 8px rgba(0,0,0,.2);
  transition: transform .2s, background-color .2s, border-color .2s;
}
/* thin orbit ring that slowly expands and fades, like a sensor ping */
.hot .badge::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid rgba(253,110,61,.7);
  animation: orbit 3.2s ease-out infinite; pointer-events: none;
}
.hot.badge-left .badge { right: auto; left: -13px; }
.hot .badge svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px rgba(0,0,0,.3)); }
.hot:focus-visible .badge, .hot.on .badge { transform: scale(1.35); background: #fd6e3d; border-color: #fff; box-shadow: 0 0 0 5px rgba(253,110,61,.28), 0 0 22px rgba(253,110,61,.8), 0 2px 8px rgba(0,0,0,.25); }
@media (hover: hover) { .hot:hover .badge { transform: scale(1.35); background: #fd6e3d; border-color: #fff; box-shadow: 0 0 0 5px rgba(253,110,61,.28), 0 0 22px rgba(253,110,61,.8), 0 2px 8px rgba(0,0,0,.25); } }
@keyframes orbit {
  0% { transform: scale(.85); opacity: 0; }
  25% { opacity: .9; }
  100% { transform: scale(1.6); opacity: 0; }
}
.hot .tag {
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translate(-50%, 4px);
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: #fff; background: rgba(16,16,18,.92); padding: 6px 10px; border-radius: 6px; border-left: 3px solid #fd6e3d;
  white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.hot.below .tag { bottom: auto; top: calc(100% + 8px); }
.hot.on .tag, .hot:focus-visible .tag, .show-all .hot .tag { opacity: 1; transform: translate(-50%, 0); }

/* catalogue tags: every object labelled, like a product on a page */
:root { --tag: #fd6e3d; }

.leaders { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
.leaders line { stroke: var(--tag); stroke-width: 1.25px; vector-effect: non-scaling-stroke; opacity: .9; }
.leaders circle { fill: var(--tag); stroke: #fff; stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.leaders .ping { fill: none; stroke: var(--tag); stroke-width: 1.5px; animation: lping 2.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes lping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
.ctag {
  position: absolute; z-index: 3; display: flex; align-items: stretch; gap: 0;
  border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; color: #fff;
  background: rgba(16, 16, 18, .8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 4px 16px rgba(0,0,0,.22); white-space: nowrap;
  transition: transform .2s, background-color .2s, opacity .4s;
}
.ctag.l { transform: translate(0, -50%); }
.ctag.r { transform: translate(-100%, -50%); }
.ctag.c { transform: translate(-50%, -100%); }
.ctag::before { content: ""; width: 5px; flex: none; background: var(--tag); }
.ctag__in { display: grid; gap: 1px; padding: 6px 10px 7px 9px; }
.ctag__code { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--tag); }
.ctag__name { font-size: 13px; font-weight: 700; line-height: 1.2; }
.ctag__hook { font-size: 11px; color: rgba(255,255,255,.72); line-height: 1.25; }
.ctag:hover, .ctag:focus-visible, .ctag.on { background: rgba(16,16,18,.94); }
.ctag:focus-visible { outline: 2px solid var(--tag); outline-offset: 2px; }
.ctag.on .ctag__name { color: var(--tag); }
.leaders g.on line { stroke-width: 2px; opacity: 1; }
/* first load: labels arrive one by one */
.intro-run .ctag { opacity: 0; }
.intro-run .ctag.in { opacity: 1; }
.intro-run .leaders g { opacity: 0; transition: opacity .4s; }
.intro-run .leaders g.in { opacity: 1; }
@media (max-width: 640px) {
  .ctag__in { padding: 5px 8px 6px 7px; }
  .ctag__name { font-size: 12px; } .ctag__hook { font-size: 10px; } .ctag__code { font-size: 8.5px; }
}
@media (prefers-reduced-motion: reduce) { .leaders .ping { animation: none; opacity: 0; } .intro-run .ctag, .intro-run .leaders g { opacity: 1; } }

/* logos: always fully on screen, bottom right */
.brandbar {
  position: fixed; z-index: 6;
  right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 18px;
  padding: 12px 8px;
}
.hot.corner img { filter: none; }
.brandbar__div { width: 1.5px; align-self: stretch; margin: 6px 4px; background: rgba(255,255,255,.6) !important; flex: none; }
.hot.corner {
  position: relative; pointer-events: auto; display: flex; align-items: center; justify-content: center;
  height: 74px; padding: 0 4px; border-radius: 10px; outline: 1.5px solid transparent; outline-offset: 6px;
  transition: outline-color .2s;
}
.hot.corner img { display: block; width: auto; }
.corner--mfs img { height: 74px; }
.corner--pathlogo img { height: 24px; }
.hot.corner .badge { top: -13px; left: -13px; }
.hot.corner.on, .hot.corner:focus-visible, .brandbar.show-all .hot.corner { outline-color: rgba(30,58,110,.55); }
.brandbar.show-all .hot.corner .tag { opacity: 1; transform: translate(-50%, 0); }
.hot.corner .tag { bottom: calc(100% + 14px); }
@media (max-width: 640px) {
  .brandbar { gap: 12px; padding: 8px 6px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .hot.corner { height: 52px; }
  .corner--mfs img { height: 52px; }
  .corner--pathlogo img { height: 17px; }
  .hot.corner img { filter: none; }
  .hint { bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }
}

/* living scene: subtle motion layered over the photo */
.scene > img { position: relative; z-index: 0; }
.fx { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.outlines { z-index: 2 !important; }
.fx > * { position: absolute; display: block; }
.fx__cam img { display: block; width: 100%; height: auto; }
.fx__lens { position: absolute; width: 16%; aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,70,40,.95), rgba(255,60,30,.45) 45%, rgba(255,40,20,0)); mix-blend-mode: screen; animation: rec 1.6s ease-in-out infinite; }
.fx__cam--r .fx__lens { animation-delay: -.8s; }
@keyframes rec { 0%,100% { opacity: .15; transform: translate(-50%,-50%) scale(.8); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } }
.fx__face { position: absolute; border-radius: 3px; }
body.tall .fx__face { filter: none; }
.fx__cam { height: auto; filter: drop-shadow(0 10px 14px rgba(0,0,0,.28)); will-change: transform; }
.fx__cam--l { }
.fx__cam--r { }
@keyframes hoverL { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(0,-5%) rotate(-1.2deg); } }
@keyframes hoverR { 0%,100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(0,-4.5%) rotate(1deg); } }
.fx__ring { border-radius: 50%; background: radial-gradient(closest-side, rgba(255,120,60,.55), rgba(255,90,40,0)); mix-blend-mode: screen; animation: ring 5.2s ease-in-out infinite; }
.fx__ring--r { animation-duration: 6.1s; animation-delay: -1.7s; }
@keyframes ring { 0%,100% { opacity: .9; transform: scale(1); } 50% { opacity: .45; transform: scale(.85); } }
.fx__holo { overflow: visible; }
/* the hologram, drawn like the product render: a clear pane with a glowing edge that tapers into the
   projection slot, the dashboard light floating on it, and a soft cone of light rising from the console */
.holo__glass { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.holo__glass path { fill: rgba(26,12,6,.34); stroke: rgba(255,196,140,.85); stroke-width: 1.4px; vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 3px rgba(255,150,70,.9)) drop-shadow(0 0 10px rgba(255,120,40,.45)); }
.holo__screen { position: absolute; left: 2.6%; right: 2.6%; top: 2.6%; height: 76.6%; border-radius: 4.5% / 6%; overflow: hidden; }
.holo__screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; opacity: 0; transition: opacity 1.1s ease;
  filter: brightness(1.05) saturate(1.05) contrast(1.05); }
.holo__screen img.on { opacity: 1; }
.holo__screen img { filter: drop-shadow(0 0 2px rgba(255,150,60,.55)); }
.holo__cone { position: absolute; left: 22%; right: 22%; top: 40%; bottom: 0; pointer-events: none;
  background: radial-gradient(50% 100% at 50% 100%, rgba(255,170,90,.55), rgba(255,140,60,.18) 45%, rgba(255,120,40,0) 75%);
  clip-path: polygon(14% 0, 86% 0, 62% 100%, 38% 100%); filter: blur(6px); animation: cone 3.8s ease-in-out infinite; }
@keyframes cone { 0%,100% { opacity: .85; } 50% { opacity: 1; } }
.fx__holo .fx__scan { left: 3%; right: 3%; top: 3%; height: 14%; opacity: .55; }
.fx__holo { animation: holoIn 1.4s ease-out both; }
@keyframes holoIn { 0% { opacity: 0; } 30% { opacity: .6; } 36% { opacity: .2; } 100% { opacity: 1; } }
.fx__scan { position: absolute; left: 0; right: 0; height: 18%; top: -20%;
  background: linear-gradient(to bottom, rgba(255,150,70,0), rgba(255,150,70,.16) 70%, rgba(255,190,120,.35) 96%, rgba(255,150,70,0));
  animation: scan 4.8s linear infinite; }
@keyframes scan { 0% { top: -20%; } 70%, 100% { top: 105%; } }
.fx__holo .fx__scan { animation-name: scanHolo; }
@keyframes scanHolo { 0% { top: 0%; opacity: 0; } 8% { opacity: .55; } 62% { top: 66%; opacity: .55; } 70%, 100% { top: 70%; opacity: 0; } }
.fx__flick { position: absolute; inset: 0; background: rgba(255,150,70,.09); animation: flick 7s steps(1) infinite; }
@keyframes flick { 0%, 100% { opacity: 0; } 41% { opacity: 1; } 42% { opacity: 0; } 43% { opacity: .7; } 44% { opacity: 0; } 78% { opacity: .5; } 79% { opacity: 0; } }
.fx__beam { background: radial-gradient(50% 60% at 50% 100%, rgba(255,160,80,.45), rgba(255,160,80,0)); mix-blend-mode: screen; animation: beam 3.6s ease-in-out infinite; }
@keyframes beam { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
.fx__smile { border-radius: 50%; background: radial-gradient(closest-side, rgba(255,60,40,.5), rgba(255,40,20,0)); mix-blend-mode: screen; animation: smile 3.2s ease-in-out infinite; }
@keyframes smile { 0%,100% { opacity: .25; } 50% { opacity: .9; } }
.fx__lap { clip-path: polygon(2.5% 0, 98.3% 0, 100% 100%, 0 100%); overflow: hidden; }
.fx__glare { position: absolute; top: -10%; bottom: -10%; width: 22%; left: -30%; transform: skewX(-18deg);
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.13), rgba(255,255,255,0)); animation: glare 9s ease-in-out infinite; }
@keyframes glare { 0%, 55% { left: -30%; } 85%, 100% { left: 115%; } }
/* live indicator: the archive is watching the visitor */
.live { position: fixed; z-index: 6; left: max(16px, env(safe-area-inset-left,0px)); bottom: calc(18px + env(safe-area-inset-bottom,0px));
  display: flex; align-items: center; gap: 9px; padding: 8px 13px 8px 11px; border-radius: 999px;
  background: rgba(14,14,16,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.12);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(242,240,236,.88); }
.live b { color: #ff4a3d; font-weight: 500; }
.live__dot { width: 9px; height: 9px; border-radius: 50%; background: #ff3b2f; box-shadow: 0 0 0 0 rgba(255,59,47,.6); animation: livedot 1.6s ease-out infinite; flex: none; }
@keyframes livedot { 0% { box-shadow: 0 0 0 0 rgba(255,59,47,.65); } 70%, 100% { box-shadow: 0 0 0 9px rgba(255,59,47,0); } }
.live__t { font-variant-numeric: tabular-nums; color: #fff; }
@media (max-width: 640px) { .live { font-size: 9.5px; padding: 6px 10px 6px 9px; gap: 7px; bottom: calc(14px + env(safe-area-inset-bottom,0px)); } .live__who { display: none; } }
@media (prefers-reduced-motion: reduce) { .live__dot { animation: none; } }
@media (prefers-reduced-motion: reduce) { .fx * { animation: none !important; } .fx__scan, .fx__glare, .fx__flick { display: none; } }

/* image viewer */
.card img:not(.tlogo) { cursor: zoom-in; }
.lb { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; align-content: center; gap: 12px;
  padding: calc(56px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  background: rgba(8,8,10,.92); backdrop-filter: blur(4px); opacity: 0; transition: opacity .18s; cursor: zoom-out; }
.lb.open { opacity: 1; }
.lb__img { max-width: min(1400px, 100%); max-height: calc(100vh - 140px); width: auto; height: auto; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.5); cursor: default; background: transparent; }
.lb__cap { margin: 0; max-width: 70ch; text-align: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: rgba(242,240,236,.7); }
.lb__x { position: absolute; top: calc(14px + env(safe-area-inset-top,0px)); right: max(16px, env(safe-area-inset-right,0px)); width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; font-size: 24px; line-height: 1; cursor: pointer; }
.lb__x:hover, .lb__x:focus-visible { background: rgba(255,255,255,.2); }

/* modal */
.scrim {
  position: fixed; inset: 0; z-index: 20;
  background: var(--scrim); backdrop-filter: blur(3px);
  display: grid; place-items: center;
  padding: calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  opacity: 0; transition: opacity .25s;
}
.scrim.open { opacity: 1; }
.card {
  position: relative; width: min(624px, 100%); max-height: 100%;
  overflow-y: auto; background: var(--card); border-radius: 20px;
  padding: 32px 32px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
  transform: translateY(12px) scale(.98); transition: transform .3s cubic-bezier(.2,.8,.2,1);
